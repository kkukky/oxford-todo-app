name: APK 만들기

on:
  push:
    branches: [main]
    paths-ignore: ["native/**", ".github/workflows/build-native-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 웹 화면을 앱에 복사
        run: npx cap sync android

      - name: APK 빌드
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: oxford-todo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 릴리스에 APK 올리기 (휴대폰에서 바로 다운로드)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk oxford-todo.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest oxford-todo.apk --title "옥스포드 투두 (최신 APK)" --notes "빌드: ${{ github.sha }}" --latest
