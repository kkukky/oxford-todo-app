name: 글쓰기 앱 APK 만들기

on:
  push:
    branches: [main, writer-app]
    paths: ["writer/**", ".github/workflows/build-writer-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: APK 빌드
        working-directory: writer
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp writer/app/build/outputs/apk/debug/app-debug.apk oxford-writer.apk
          gh release delete writer-latest --yes --cleanup-tag || true
          gh release create writer-latest oxford-writer.apk --title "메모 글쓰기 앱 (최신 APK)" --notes "빌드: ${{ github.sha }}" --target "${{ github.sha }}"
