name: 네이티브 APK 만들기

on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/build-native-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: APK 빌드
        working-directory: native
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 릴리스에 APK 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(cat native/VERSION | tr -d ' \n')
          cp native/app/build/outputs/apk/debug/app-debug.apk oxford-todo-native.apk
          cp native/app/build/outputs/apk/debug/app-debug.apk "oxford-todo-native-v${VER}.apk"
          gh release delete native-latest --yes --cleanup-tag || true
          gh release create native-latest oxford-todo-native.apk "oxford-todo-native-v${VER}.apk" --title "옥스포드 투두 네이티브 v${VER} (최신 APK)" --notes "버전 ${VER} · 빌드: ${{ github.sha }}"
